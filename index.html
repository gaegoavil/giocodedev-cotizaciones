<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Giocodedev_</title>
<style>
  :root { color-scheme: light dark; --bg: #F3F4F8; --ink: #121527; --accent: #3A2EF0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0C0E17; --ink: #ECEEF7; --accent: #8F86FF; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 600 clamp(1.6rem, 5vw, 3rem) ui-monospace, Consolas, Menlo, monospace; }
  i { display: inline-block; width: .55em; height: .12em; background: var(--accent); animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity: .2; } }
</style>
</head>
<body><p>Giocodedev<i></i></p></body>
</html>
